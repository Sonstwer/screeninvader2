<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>ScreenInvader 2.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrapper">
    <header class="topbar">
        <div>
            <h1>ScreenInvader 2.0</h1>
            <p>Lokale Audio-Jukebox im Netzwerk</p>
        </div>
        <div class="topbar-meta">
            <span class="chip">Audio only</span>
        </div>
    </header>

    <main class="layout">
        <section class="card search-section">
            <div class="section-head">
                <h2>Suche</h2>
            </div>

            <div class="search-bar">
                <input type="text" id="search-input" placeholder="YouTube-Suche oder direkte URL …">
                <button id="search-button" class="primary-button">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 21l-4.35-4.35"></path>
                            <circle cx="11" cy="11" r="6"></circle>
                        </svg>
                    </span>
                    <span class="btn-label">Suchen</span>
                </button>
            </div>

            <div id="search-meta" class="helper-text"></div>
            <div id="search-results" class="result-list"></div>
        </section>

        <section class="card player-section">
            <div class="section-head">
                <h2>Player</h2>
            </div>

            <div id="player-status" class="player-status">
                <div class="player-line"><span class="muted">Status</span><strong id="status-text">Leerlauf</strong></div>
                <div class="player-line"><span class="muted">Titel</span><strong id="status-title">–</strong></div>
                <div class="player-line"><span class="muted">Fortschritt</span><strong id="status-position">–</strong></div>
            </div>

            <div class="player-controls">
                <button id="toggle-play-button" class="control-button accent" title="Play / Pause">
                    <span class="btn-icon">
                        <svg id="toggle-play-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                    </span>
                    <span id="toggle-play-label">Play</span>
                </button>

                <button id="prev-button" class="control-button" title="Vorheriger Titel">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M19 20L9 12l10-8v16z"></path>
                            <path d="M5 19V5"></path>
                        </svg>
                    </span>
                    <span>Zurück</span>
                </button>

                <button id="next-button" class="control-button" title="Nächster Titel">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 4l10 8-10 8V4z"></path>
                            <path d="M19 5v14"></path>
                        </svg>
                    </span>
                    <span>Weiter</span>
                </button>

                <button id="stop-button" class="control-button" title="Stop">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="6" y="6" width="12" height="12" rx="1"></rect>
                        </svg>
                    </span>
                    <span>Stop</span>
                </button>

                <button id="shuffle-button" class="control-button" title="Playlist mischen">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M16 3h5v5"></path>
                            <path d="M4 20l7-7"></path>
                            <path d="M21 3l-7 7"></path>
                            <path d="M4 4l7 7"></path>
                            <path d="M14 14l7 7"></path>
                        </svg>
                    </span>
                    <span>Shuffle</span>
                </button>

                <button id="clear-queue-button" class="control-button danger" title="Playlist leeren">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M19 6l-1 14H6L5 6"></path>
                        </svg>
                    </span>
                    <span>Leeren</span>
                </button>
            </div>
        </section>

        <section class="card queue-section">
            <div class="section-head">
                <h2>Wiedergabeliste</h2>
                <div class="helper-text" id="queue-meta"></div>
            </div>
            <div id="queue-list" class="queue-list"></div>
        </section>
    </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
